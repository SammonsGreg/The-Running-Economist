rder-radius:10px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:10px 14px;border-radius:11px;font-weight:750}.btn.secondary{background:transparent;color:var(--navy)}.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--focus);outline-offset:2px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow:auto;padding-bottom:6px}.day{min-height:158px;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card)}.day.today{border:3px solid var(--crimson)}.day.done{background:#eef8f2}.day h3{font-size:.95rem;margin:0 0 6px}.day p{font-size:.88rem;margin:.25rem 0}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--blue);padding:11px;border-radius:11px}.metric strong{display:block;font-size:1.25rem}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-weight:720}input,select,textarea{width:100%;border:1px solid #9fb0ba;border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}input[type=range]{padding:0}.range-output{font-weight:800;color:var(--crimson)}.notice{padding:12px;border-radius:10px;background:var(--blue)}.log-list{display:grid;gap:10px}.log-item{border-left:5px solid var(--teal);padding:12px;background:var(--card);border-radius:10px}.muted{color:var(--muted)}.review-flag{padding:12px;border-radius:10px;margin-top:10px}.flag-good{background:#e7f6ee;color:#145d3d}.flag-watch{background:#fff3dd;color:#704600}.flag-review{background:#fdeaea;color:#7b2222}.empty{padding:24px;text-align:center;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0, <body>
<header class="top"><div class="top-inner"><div class="brand"><h1>The Running Economist</h1><p>Smarter miles.</p></div><div class="datebox"><strong id="headerDate"></strong><br><span id="raceCountdown"></span></div></div></header>
<main class="shell">
<nav class="tabs" aria-label="Primary navigation" role="tablist">
<button class="tab" role="tab" aria-selected="true" aria-controls="today" id="tab-today" data-panel="today">Today</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="week" id="tab-week" data-panel="week">This Week</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="log" id="tab-log" data-panel="log">Log</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="review" id="tab-review" data-panel="review">Review</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="about" id="tab-about" data-panel="about">Purpose</button>
</nav>
<section id="today" class="panel active" role="tabpanel" aria-labelledby="tab-today"><div id="todayContent"></div></section>
<section id="week" class="panel" role="tabpanel" aria-labelledby="tab-week"><div id="weekContent"></div></section>
<section id="log" class="panel" role="tabpanel" aria-labelledby="tab-log">
<div class="card"><h2>Log the run</h2><p class="muted">One form across every run. Stored only in this browser.</p>
<form id="runForm" novalidate><div class="form-grid">
<div class="field"><label for="logDate">Date</label><input id="logDate" name="date" type="date" required></div>
<div class="field"><label for="status">Execution</label><select id="status" name="status"><option>Completed</option><option>Modified</option><option>Skipped</option></select></div>
<div class="field"><label for="distance">Actual distance (miles)</label><input id="distance" name="distance" type="number" min="0" max="50" step="0.01" inputmode="decimal"></div>
<div class="field"><label for="duration">Duration (hh:mm:ss or mm:ss)</label><input id="duration" name="duration" placeholder="1:02:30" inputmode="numeric"></div>
<div class="field"><label for="avgPace">Average pace</label><input id="avgPace" name="avgPace" readonly aria-describedby="paceHelp"><small id="paceHelp" class="muted">Calculated from distance and duration.</small></div>
<div class="field"><label for="avgHr">Average HR (bpm)</label><input id="avgHr" name="avgHr" type="number" min="40" max="230" inputmode="numeric"></div>
<div class="field"><label for="rpe">RPE: <output id="rpeOut" class="range-output">3</output>/10</label><input id="rpe" name="rpe" type="range" min="1" max="10" value="3"></div>
<div class="field"><label for="comfort">Mechanics and physical comfort: <output id="comfortOut" class="range-output">10</output>/10</label><input id="comfort" name="comfort" type="range" min="0" max="10" value="10"><small class="muted">10 = normal, smooth and comfortable. 0 = unable to run normally.</small></div>
<div class="field"><label for="shoe">Shoe</label><select id="shoe" name="shoe"></select></div>
<div class="field full"><label for="note">Short note</label><textarea id="note" name="note" rows="3" maxlength="400"></textarea></div>
<div class="field full"><div id="formMessage" class="notice" aria-live="polite">No automatic changes. This record supports reflection.</div></div>
</div><div class="actions"><button class="btn" type="submit">Save run</button><button class="btn secondary" type="button" id="resetForm">Clear</button></div></form></div>
<div class="card" style="margin-top:16px"><h2>Recent records</h2><div id="recentLogs" class="log-list"></div></div>
</section>
<section id="review" class="panel" role="tabpanel" aria-labelledby="tab-review"><div id="reviewContent"></div></section>
<section id="about" class="panel" role="tabpanel" aria-labelledby="tab-about"><div id="aboutContent"></div></section>
</main>

const STORAGE_KEY = "runningEconomist.logs.v1";
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const parseLocalDate = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const toISO = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
const addDays = (date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d};
const formatDate = date => new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}).format(date);
const loadLogs = ()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}};
const saveLogs = logs=>localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));

function planEntryForDate(date){
  const start=parseLocalDate(APP_DATA.planStart); const diff=Math.floor((date-start)/86400000);
  if(diff<0||diff>=APP_DATA.weeks.length*7) return null;
  const weekIndex=Math.floor(diff/7), dayIndex=diff%7;
  return {week:APP_DATA.weeks[weekIndex],day:APP_DATA.weeks[weekIndex].days[dayIndex],weekIndex,dayIndex,date};
}
function plannedDate(weekIndex,dayIndex){return addDays(parseLocalDate(APP_DATA.planStart),weekIndex*7+dayIndex)}
function logForDate(iso){return loadLogs().find(x=>x.date===iso)}
function durationSeconds(text){
  if(!text) return 0; const parts=text.trim().split(":").map(Number); if(parts.some(Number.isNaN)) return 0;
  if(parts.length===2) return parts[0]*60+parts[1]; if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2]; return 0;
}
function paceFrom(distance,duration){const sec=durationSeconds(duration); if(!(distance>0&&sec>0)) return ""; const p=sec/distance; return `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,"0")}/mi`;}
function todayOrDemo(){
  const now=new Date(); const entry=planEntryForDate(now); return entry?now:parseLocalDate(APP_DATA.planStart);
}
function renderHeader(){const now=todayOrDemo(); $("#headerDate").textContent=formatDate(now); const days=Math.ceil((parseLocalDate(APP_DATA.race.date)-now)/86400000); $("#raceCountdown").textContent=days>=0?`${days} days to ${APP_DATA.race.name}`:`${APP_DATA.race.name} completed`;}
function renderToday(){
  const date=todayOrDemo(), entry=planEntryForDate(date), host=$("#todayContent");
  if(!entry){host.innerHTML='<div class="card empty">Today is outside the loaded plan.</div>';return}
  const [type,details,miles,why,guardrail]=entry.day, iso=toISO(date), log=logForDate(iso);
  host.innerHTML=`<div class="grid two"><article class="card hero"><div class="eyebrow">${escapeHtml(DAY_NAMES[entry.dayIndex])} · ${String(entry.week.week).startsWith("B")?"Bridge Week "+String(entry.week.week).slice(1):"Marathon Week "+String(entry.week.week).slice(1)} · ${escapeHtml(entry.week.phase)}</div><h2 class="workout-title">${escapeHtml(type)}</h2><p>${escapeHtml(details)}</p><div class="chips"><span class="chip">${miles} planned mi</span><span class="chip">Week total ${entry.week.mileage} mi</span>${log?'<span class="chip">Logged</span>':''}</div><div class="why"><strong>Why this exists</strong><br>${escapeHtml(why)}</div><div class="guardrail" style="margin-top:12px"><strong>Today’s guardrail</strong><br>${escapeHtml(guardrail)}</div><div class="actions"><button class="btn" data-go-log="${iso}">${log?'Update log':'Log workout'}</button><button class="btn secondary" data-show-week>View week</button></div></article><aside class="card"><h2>Personal context</h2><dl><dt><strong>Working MP</strong></dt><dd>${APP_DATA.race.workingMP}</dd><dt><strong>Easy profile</strong></dt><dd>${APP_DATA.profile.easy.pace}, ${APP_DATA.profile.easy.hr}, RPE ${APP_DATA.profile.easy.rpe}</dd><dt><strong>Long-run profile</strong></dt><dd>${APP_DATA.profile.long.pace}. ${APP_DATA.profile.long.principle}</dd></dl><p class="notice"><strong>No automatic changes.</strong> The app records, compares and explains.</p></aside></div>`;
}
function weekIndexFor(date){const diff=Math.floor((date-parseLocalDate(APP_DATA.planStart))/86400000);return Math.max(0,Math.min(APP_DATA.weeks.length-1,Math.floor(diff/7)));}
function renderWeek(index=weekIndexFor(todayOrDemo())){
 const week=APP_DATA.weeks[index], todayISO=toISO(todayOrDemo()), logs=loadLogs();
 $("#weekContent").innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><button class="btn secondary" id="prevWeek" ${index===0?'disabled':''}>Previous</button><div><div class="eyebrow">${String(week.week).startsWith("B")?"Bridge Week "+String(week.week).slice(1):"Marathon Week "+String(week.week).slice(1)}</div><h2 style="margin:.1rem 0">${escapeHtml(week.phase)} · ${week.mileage} miles</h2></div><button class="btn secondary" id="nextWeek" ${index===APP_DATA.weeks.length-1?'disabled':''}>Next</button></div><div class="week-grid" style="margin-top:16px">${week.days.map((d,i)=>{const iso=toISO(plannedDate(index,i)),logged=logs.some(x=>x.date===iso);return `<article class="day ${iso===todayISO?'today':''} ${logged?'done':''}"><h3>${DAY_NAMES[i]}</h3><div class="eyebrow">${escapeHtml(d[0])}</div><p>${escapeHtml(d[1])}</p><p><strong>${d[2]} mi</strong></p>${logged?'<p class="muted">✓ Logged</p>':''}<button class="btn secondary" data-go-log="${iso}">Log</button></article>`}).join("")}</div></div>`;
 $("#prevWeek").addEventListener("click",()=>renderWeek(index-1)); $("#nextWeek").addEventListener("click",()=>renderWeek(index+1));
}
function populateForm(){
 $("#shoe").innerHTML=APP_DATA.shoes.map(s=>`<option>${escapeHtml(s)}</option>`).join(""); $("#logDate").value=toISO(todayOrDemo());
 const updatePace=()=>$("#avgPace").value=paceFrom(Number($("#distance").value),$("#duration").value);
 $("#distance").addEventListener("input",updatePace); $("#duration").addEventListener("input",updatePace);
 $("#rpe").addEventListener("input",e=>$("#rpeOut").value=e.target.value); $("#comfort").addEventListener("input",e=>$("#comfortOut").value=e.target.value);
 $("#resetForm").addEventListener("click",()=>fillForm({date:$("#logDate").value}));
 $("#runForm").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.currentTarget),date=f.get("date");if(!date){$("#formMessage").textContent="Choose a date.";return} const record={date,status:f.get("status"),distance:Number(f.get("distance")||0),duration:f.get("duration").trim(),avgPace:$("#avgPace").value,avgHr:Number(f.get("avgHr")||0),rpe:Number(f.get("rpe")),comfort:Number(f.get("comfort")),shoe:f.get("shoe"),note:f.get("note").trim(),savedAt:new Date().toISOString()};let logs=loadLogs().filter(x=>x.date!==date);logs.push(record);logs.sort((a,b)=>a.date.localeCompare(b.date));saveLogs(logs);$("#formMessage").textContent="Saved locally. No plan changes were made.";renderRecent();renderToday();renderWeek(weekIndexFor(parseLocalDate(date)));renderReview();});
}
function fillForm(record={}){const form=$("#runForm");form.reset();$("#logDate").value=record.date||toISO(todayOrDemo());$("#status").value=record.status||"Completed";$("#distance").value=record.distance||"";$("#duration").value=record.duration||"";$("#avgPace").value=record.avgPace||"";$("#avgHr").value=record.avgHr||"";$("#rpe").value=record.rpe||3;$("#comfort").value=record.comfort??10;$("#rpeOut").value=$("#rpe").value;$("#comfortOut").value=$("#comfort").value;$("#shoe").value=record.shoe||APP_DATA.shoes[0];$("#note").value=record.note||"";}
function renderRecent(){const logs=loadLogs().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);$("#recentLogs").innerHTML=logs.length?logs.map(l=>`<article class="log-item"><strong>${escapeHtml(l.date)} · ${escapeHtml(l.status)}</strong><br>${l.distance||0} mi${l.avgPace?` · ${escapeHtml(l.avgPace)}`:''}${l.avgHr?` · ${l.avgHr} bpm`:''} · RPE ${l.rpe} · Comfort ${l.comfort}/10<br><span class="muted">${escapeHtml(l.shoe)}${l.note?` · ${escapeHtml(l.note)}`:''}</span><div class="actions"><button class="btn secondary" data-edit-log="${l.date}">Edit</button><button class="btn danger" data-delete-log="${l.date}">Delete</button></div></article>`).join(""):'<div class="empty">No runs logged yet.</div>';}
function reviewFlag(entry,log){if(!log)return {css:"flag-watch",title:"Not logged",text:"No conclusion. The app does not assume an unlogged workout was completed."};if(log.status==="Skipped")return {css:"flag-review",title:"Review",text:"The run was skipped. Apply the written missed-run rules manually; the app will not reschedule it."};if(log.comfort<=3)return {css:"flag-review",title:"Review",text:"Mechanics and physical comfort were clearly abnormal. Do not let the app diagnose or autonomously adapt the plan."};if(log.comfort<=6||log.rpe>=8)return {css:"flag-watch",title:"Worth reviewing",text:"The response was meaningfully harder or less comfortable. Compare with context and patterns, not a single metric."};if(entry&&entry.day[0].includes("Easy")&&log.avgHr>=150)return {css:"flag-watch",title:"Worth reviewing",text:"Average HR was above the established easy range. Weather, terrain, fatigue and measurement quality still matter."};return {css:"flag-good",title:"Consistent",text:"The logged response appears broadly consistent with the workout purpose. No automatic changes."};}
function renderReview(){
 const date=todayOrDemo(), wi=weekIndexFor(date), week=APP_DATA.weeks[wi], logs=loadLogs(), start=plannedDate(wi,0), end=plannedDate(wi,6), weekLogs=logs.filter(l=>parseLocalDate(l.date)>=start&&parseLocalDate(l.date)<=end), actual=weekLogs.reduce((s,l)=>s+(l.distance||0),0), planned=week.mileage, avgRpe=weekLogs.length?(weekLogs.reduce((s,l)=>s+l.rpe,0)/weekLogs.length).toFixed(1):"—", avgComfort=weekLogs.length?(weekLogs.reduce((s,l)=>s+l.comfort,0)/weekLogs.length).toFixed(1):"—";
 const flags=weekLogs.map(l=>{const e=planEntryForDate(parseLocalDate(l.date));return {date:l.date,...reviewFlag(e,l)}});
 $("#reviewContent").innerHTML=`<div class="card"><div class="eyebrow">${String(week.week).startsWith("B")?"Bridge Week "+String(week.week).slice(1):"Marathon Week "+String(week.week).slice(1)} review</div><h2>${escapeHtml(week.phase)}</h2><div class="metric-row"><div class="metric"><span>Planned</span><strong>${planned}</strong><span>miles</span></div><div class="metric"><span>Logged</span><strong>${actual.toFixed(1)}</strong><span>miles</span></div><div class="metric"><span>Avg RPE</span><strong>${avgRpe}</strong><span>1–10</span></div><div class="metric"><span>Avg comfort</span><strong>${avgComfort}</strong><span>0–10</span></div></div><h3 style="margin-top:20px">Observations</h3>${flags.length?flags.map(f=>`<div class="review-flag ${f.css}"><strong>${escapeHtml(f.date)} · ${f.title}</strong><br>${escapeHtml(f.text)}</div>`).join(""):'<div class="empty">Log runs to create transparent observations.</div>'}<p class="notice"><strong>Plan status:</strong> No automatic changes. Review the evidence and the written guardrails.</p></div>`;
}
function renderAbout(){$("#aboutContent").innerHTML=`<div class="grid two"><article class="card"><div class="eyebrow">Purpose</div><h2>${APP_DATA.title}</h2><p><strong>${APP_DATA.tagline}</strong></p><p>${escapeHtml(APP_DATA.purpose)}</p><blockquote class="why">On any morning, the application shows the correct workout, its exact execution, the relevant guardrail, and a frictionless way to log what happened.</blockquote><h3>The application will</h3><ol>${APP_DATA.will.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ol></article><article class="card"><h2>The application will not</h2><ol>${APP_DATA.willNot.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ol><h3>Core guardrails</h3><ul>${APP_DATA.universalGuardrails.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul><h3>Curated runner profile</h3><p>${escapeHtml(APP_DATA.runnerProfile.summary)}</p><p><strong>Established capacity:</strong> ${escapeHtml(APP_DATA.runnerProfile.trainingHistory.at(-1).volume)}.</p><p><strong>Performance anchors:</strong> ${APP_DATA.runnerProfile.performanceAnchors.map(x=>`${escapeHtml(x.distance)} ${escapeHtml(x.time)}`).join(" · ")}</p><p><strong>Individual effort model:</strong> resting HR ${APP_DATA.runnerProfile.effortModel.restingHr}; observed max HR ${APP_DATA.runnerProfile.effortModel.observedMaxHr}. HR remains contextual, especially on easy days.</p><details><summary><strong>Training principles</strong></summary><ul>${APP_DATA.runnerProfile.trainingPrinciples.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul></details><details><summary><strong>Privacy boundary</strong></summary><p><strong>Included:</strong> ${escapeHtml(APP_DATA.runnerProfile.privacyBoundary.included)}</p><p><strong>Excluded:</strong> ${escapeHtml(APP_DATA.runnerProfile.privacyBoundary.excluded)}</p></details><p class="notice">All records remain in this browser’s local storage. Export is not included in this first file.</p></article></div>`;}
function activate(panel){$$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.panel===panel)));$$('.panel').forEach(p=>p.classList.toggle('active',p.id===panel));$(`#${panel}`).focus?.();}

document.addEventListener("click",e=>{const tab=e.target.closest(".tab");if(tab)activate(tab.dataset.panel);const go=e.target.closest("[data-go-log]");if(go){const date=go.dataset.goLog, existing=logForDate(date);fillForm(existing||{date});activate("log");$("#distance").focus();}if(e.target.closest("[data-show-week]"))activate("week");const edit=e.target.closest("[data-edit-log]");if(edit){fillForm(logForDate(edit.dataset.editLog));activate("log");}const del=e.target.closest("[data-delete-log]");if(del&&confirm("Delete this local record?")){saveLogs(loadLogs().filter(x=>x.date!==del.dataset.deleteLog));renderRecent();renderToday();renderWeek();renderReview();}});
$$('.tab').forEach((tab,i)=>tab.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();const tabs=$$('.tab'),next=e.key==='ArrowRight'?(i+1)%tabs.length:(i-1+tabs.length)%tabs.length;tabs[next].focus();tabs[next].click();}));

renderHeader();renderToday();renderWeek();populateForm();renderRecent();renderReview();renderAbout();
</script>
